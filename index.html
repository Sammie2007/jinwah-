const BY_ID = Object.fromEntries(BOOK.map(b=>[b.id,b]));
const GROUPS = [
  {kind:'front',   label:'Beginnings'},
  {kind:'chapter', label:'The Chronicle'},
  {kind:'lore',    label:'Codex of Factions'}
];

/* ─────────────── STATE & STORAGE ─────────────── */
const store = {
  get theme(){ try{return localStorage.getItem('vh:theme')}catch(e){return null} },
  set theme(v){ try{localStorage.setItem('vh:theme',v)}catch(e){} },
  get last(){ try{return localStorage.getItem('vh:last')}catch(e){return null} },
  set last(v){ try{localStorage.setItem('vh:last',v)}catch(e){} },
  get set(){ try{return JSON.parse(localStorage.getItem('vh:set'))||null}catch(e){return null} },
  set set(v){ try{localStorage.setItem('vh:set',JSON.stringify(v))}catch(e){} }
};

const FS_MIN=15, FS_MAX=24;
const LH_STEPS=[1.6,1.7,1.8,1.95,2.1];
let cfg = Object.assign({fs:18, lhIdx:2, wide:false}, store.set || {});

let current = null;

/* ─────────────── TOAST ─────────────── */
let toastTimer=null;
function toast(html){
  const t=$('#toast');
  t.innerHTML=html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}

/* ─────────────── THEME ─────────────── */
function applyTheme(t,silent){
  document.documentElement.setAttribute('data-theme',t);
  $('#metaTheme').setAttribute('content', t==='dark' ? '#0a0b0e' : '#edeff4');
  $('#themeBtn').setAttribute('aria-label', t==='dark'?'Switch to Gloss Clean (light)':'Switch to Goth Smooth (dark)');
  store.theme=t;
  if(!silent) toast(t==='dark' ? '☾ <b>Goth Smooth</b> engaged' : '☀ <b>Gloss Clean</b> engaged');
}

/* ─────────────── SETTINGS ─────────────── */
function applyCfg(){
  const root=document.documentElement.style;
  root.setProperty('--fs', cfg.fs+'px');
  root.setProperty('--lh', LH_STEPS[cfg.lhIdx]);
  document.body.classList.toggle('measure-wide', !!cfg.wide);
  $('#fsVal').textContent=cfg.fs;
  $('#lhVal').textContent=LH_STEPS[cfg.lhIdx].toFixed(2);
  $('#fsMinus').disabled = cfg.fs<=FS_MIN;
  $('#fsPlus').disabled  = cfg.fs>=FS_MAX;
  $('#lhMinus').disabled = cfg.lhIdx<=0;
  $('#lhPlus').disabled  = cfg.lhIdx>=LH_STEPS.length-1;
  $('#mBook').classList.toggle('on',!cfg.wide);
  $('#mWide').classList.toggle('on',!!cfg.wide);
  store.set=cfg;
}

/* ─────────────── NAVIGATION MODEL ─────────────── */
function parseHash(){
  const h=location.hash.replace(/^#/,'');
  return BY_ID[h] ? h : null;
}
function neighbors(id){
  const i=BOOK.findIndex(b=>b.id===id);
  return { prev: i>0 ? BOOK[i-1] : null, next: i<BOOK.length-1 ? BOOK[i+1] : null };
}
function readMinutes(text){
  const w=text.trim().split(/\s+/).length;
  return Math.max(1, Math.round(w/230));
}

/* ─────────────── RENDER ─────────────── */
function render(id){
  const item=BY_ID[id]; if(!item) return;
  current=id;
  store.last=id;

  const art=$('#article');
  art.className='prose pre'+(item.kind==='lore'?' lore':'');

  /* — header — */
  let html =
    '<div class="kicker" style="--d:0ms">'+esc(item.tag)+'</div>'+
    '<h1 class="title" style="--d:40ms">'+esc(item.title)+'</h1>'+
    '<p class="subtitle" style="--d:80ms">'+esc(item.sub)+'</p>'+
    '<div class="orn" style="--d:110ms" aria-hidden="true"><i></i></div>'+
    '<div class="meta" style="--d:140ms">'+
      (item.kind==='chapter' ? '<span>Chapter <b>'+esc(item.num)+'</b></span><span class="dot"></span>' :
       item.kind==='lore'    ? '<span>Codex <b>'+esc(item.num)+'</b></span><span class="dot"></span>' :
                               '<span><b>Overture</b></span><span class="dot"></span>')+
      '<span>~'+readMinutes(item.text)+' min read</span>'+
    '</div>';

  /* — codex chrome — */
  if(item.kind==='lore'){
    html+='<div class="chips" style="--d:170ms"><span>'+esc(item.chip)+'</span><span>Faction Record</span><span>Verified</span></div>';
    html+='<div class="plate" style="--d:200ms">';
  }

  /* — body paragraphs — */
  const paras=item.text.trim().split(/(?:\r?
){2,}/);
  paras.forEach((p,i)=>{
    html+='<p style="--d:'+Math.min(200+i*45, 900)+'ms">'+esc(p.trim())+'</p>';
  });

  if(item.kind==='lore'){
    html+='<div class="archiveline">Filed · The Infinite Archive</div></div>';
  }

  if(item.note){
    html+='<aside class="anote"><span>Marginalia</span>'+esc(item.note)+'</aside>';
  }

  html+='<div class="fin" style="--d:940ms" aria-hidden="true"><span>'+(item.kind==='lore'?'❖':'✦')+'</span></div>';

  art.innerHTML=html;

  /* staggered entrance */
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    art.classList.remove('pre'); art.classList.add('in');
  }));

  /* — chrome sync — */
  document.title=item.title+' · VOIDHEART';
  $('#crumb').innerHTML='<b>'+esc(item.num)+'</b>'+esc(item.kind==='chapter'?'Chapter '+item.num:item.tag)+' — '+esc(item.title);

  const nb=neighbors(id);
  setPager($('#pgPrev'), nb.prev, '← Previous');
  setPager($('#pgNext'), nb.next, 'Next →');

  $$('#navList .ni').forEach(a=>{
    const on=a.dataset.id===id;
    a.classList.toggle('active',on);
    a.setAttribute('aria-current',on?'page':'false');
    if(on) a.scrollIntoView({block:'nearest'});
  });

  updateResume();
  window.scrollTo({top:0,left:0,behavior:'auto'});
  updateProgress();
}

function setPager(el,item,label){
  if(!item){ el.classList.add('ghost'); el.removeAttribute('href'); el.querySelector('small').textContent=label; el.querySelector('strong').textContent='—'; return; }
  el.classList.remove('ghost');
  el.setAttribute('href','#'+item.id);
  el.querySelector('small').textContent=label;
  el.querySelector('strong').textContent=(item.num!==''?item.num+' · ':'')+item.title;
}

/* canonicalise unknown hashes so the URL never points at a dead state */
function go(rawId){
  const id = BY_ID[rawId] ? rawId : FALLBACK;
  if(id===current){ history.replaceState(null,'','#'+id); return; }
  render(id);
  if(parseHash()!==id) history.replaceState(null,'','#'+id);
}

/* ─────────────── BUILD SIDEBAR ─────────────── */
function buildNav(){
  const nav=$('#navList'); let html='';
  GROUPS.forEach(g=>{
    const items=BOOK.filter(b=>b.kind===g.kind);
    if(!items.length) return;
    html+='<section class="grp" data-kind="'+g.kind+'">';
    html+='<div class="grp-label"><i>◈</i>'+g.label+'<span style="letter-spacing:.05em;opacity:.6">('+items.length+')</span></div>';
    items.forEach(b=>{
      html+='<a class="ni" href="#'+b.id+'" data-id="'+b.id+'" data-search="'+esc((b.num+' '+b.title).toLowerCase())+'">'+
            '<span class="nn">'+esc(b.num)+'</span><span class="nt">'+esc(b.title)+'</span></a>';
    });
    html+='</section>';
  });
  html+='<div class="nores">No chapters echo that name.</div>';
  nav.innerHTML=html;
}

/* ─────────────── RESUME CHIP ─────────────── */
function updateResume(){
  const saved=store.last;
  const chip=$('#resume');
  if(saved && BY_ID[saved] && saved!==current){
    $('#resumeTxt').textContent='Continue — '+BY_ID[saved].title;
    chip.hidden=false;
  }else{
    chip.hidden=true;
  }
}

/* ─────────────── PROGRESS BAR ─────────────── */
let progTick=false;
function updateProgress(){
  if(progTick) return; progTick=true;
  requestAnimationFrame(()=>{
    const max=document.documentElement.scrollHeight-innerHeight;
    const p=max>0 ? Math.min(1, scrollY/max) : 0;
    $('#progress i').style.transform='scaleX('+p+')';
    progTick=false;
  });
}

/* ─────────────── STARFIELD ─────────────── */
function genStars(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const host=$('#stars'); const frag=document.createDocumentFragment();
  for(let i=0;i<70;i++){
    const s=document.createElement('span');
    s.className='star';
    const sz=Math.random()<.82?1:2;
    s.style.width=s.style.height=sz+'px';
    s.style.left=(Math.random()*100).toFixed(2)+'%';
    s.style.top=(Math.random()*100).toFixed(2)+'%';
    s.style.setProperty('--o',(0.15+Math.random()*0.55).toFixed(2));
    s.style.setProperty('--dur',(2.6+Math.random()*4.4).toFixed(2)+'s');
    s.style.setProperty('--del',(-Math.random()*6).toFixed(2)+'s');
    frag.appendChild(s);
  }
  host.appendChild(frag);
}

/* ─────────────── EVENTS ─────────────── */
function bind(){
  /* routing */
  addEventListener('hashchange',()=>go(parseHash()));

  /* close drawer when a chapter is chosen (mobile) */
  $('#navList').addEventListener('click',e=>{
    const a=e.target.closest('.ni');
    if(a) document.body.classList.remove('nav-open');
  });
  $('#pgPrev').addEventListener('click',()=>document.body.classList.remove('nav-open'));
  $('#pgNext').addEventListener('click',()=>document.body.classList.remove('nav-open'));

  /* drawer controls */
  $('#menuBtn').addEventListener('click',()=>{
    if(innerWidth>=1160) document.body.classList.toggle('rail-off');
    else document.body.classList.toggle('nav-open');
  });
  $('#closeBtn').addEventListener('click',()=>document.body.classList.remove('nav-open'));
  $('#scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));

  /* theme */
  $('#themeBtn').addEventListener('click',()=>{
    applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  });

  /* settings popover */
  const pop=$('#pop');
  $('#setBtn').addEventListener('click',e=>{ e.stopPropagation(); pop.classList.toggle('open'); });
  document.addEventListener('click',e=>{
    if(pop.classList.contains('open') && !e.target.closest('#pop') && !e.target.closest('#setBtn'))
      pop.classList.remove('open');
  });

  $('#fsMinus').addEventListener('click',()=>{ cfg.fs=Math.max(FS_MIN,cfg.fs-1); applyCfg(); });
  $('#fsPlus') .addEventListener('click',()=>{ cfg.fs=Math.min(FS_MAX,cfg.fs+1); applyCfg(); });
  $('#lhMinus').addEventListener('click',()=>{ cfg.lhIdx=Math.max(0,cfg.lhIdx-1); applyCfg(); });
  $('#lhPlus') .addEventListener('click',()=>{ cfg.lhIdx=Math.min(LH_STEPS.length-1,cfg.lhIdx+1); applyCfg(); });
  $('#mBook').addEventListener('click',()=>{ cfg.wide=false; applyCfg(); });
  $('#mWide').addEventListener('click',()=>{ cfg.wide=true; applyCfg(); });

  /* nav filter */
  $('#navFilter').addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    let hits=0;
    $$('#navList .ni').forEach(a=>{
      const show=!q || a.dataset.search.includes(q);
      a.classList.toggle('hide',!show);
      if(show) hits++;
    });
    $$('#navList .grp').forEach(g=>{
      g.style.display=g.querySelectorAll('.ni:not(.hide)').length?'':'none';
    });
    $('.nores').style.display=hits?'none':'block';
  });

  /* resume chip */
  $('#resume').addEventListener('click',()=>{ location.hash=store.last; });

  /* scroll progress */
  addEventListener('scroll',updateProgress,{passive:true});

  /* resize guards */
  addEventListener('resize',()=>{
    if(innerWidth>=1160) document.body.classList.remove('nav-open');
    updateProgress();
  });

  /* keyboard */
  addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const t=e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)){
      if(e.key==='Escape') t.blur();
      return;
    }
    switch(e.key){
      case 'ArrowRight':{ const n=neighbors(current).next; if(n) location.hash=n.id; break; }
      case 'ArrowLeft': { const p=neighbors(current).prev; if(p) location.hash=p.id; break; }
      case 't': case 'T':
        applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); break;
      case 'c': case 'C':
        if(innerWidth>=1160) document.body.classList.toggle('rail-off');
        else document.body.classList.toggle('nav-open');
        break;
      case 'Escape':
        document.body.classList.remove('nav-open');
        $('#pop').classList.remove('open');
        break;
    }
  });
}

/* ─────────────── BOOT ─────────────── */
document.addEventListener('DOMContentLoaded',()=>{
  history.scrollRestoration='manual';
  buildNav();
  applyCfg();
  applyTheme(store.theme || 'dark', true);
  genStars();
  bind();

  /* CRITICAL: never boot to a blank pane — resolve the deepest valid
     target (hash → saved position → prologue) and paint it instantly. */
  const initial = parseHash() || store.last && BY_ID[store.last] ? (parseHash() || store.last) : FALLBACK;
  go(initial);
});
</script>
</body>
</html>
